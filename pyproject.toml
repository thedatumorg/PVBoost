[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pvboost"
version = "1.0.0"
description = "PVBoost: label-free score refinement and thresholding for time-series anomaly detection"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "pandas>=2.0",
    "torch>=2.0",
]

[project.optional-dependencies]
benchmark = ["TSB-AD"]

[tool.setuptools]
packages = ["pvboost"]
